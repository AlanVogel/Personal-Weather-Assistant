# Railway reads this when the service's Root Directory is set to `backend`,
# which makes the Docker build context `backend/` — matching the Dockerfile's
# context-relative COPY instructions.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Wrapped in a shell so $PORT is expanded. Railway runs startCommand in exec
# form, which does NOT expand variables — without the shell, uvicorn receives
# the literal string "$PORT" and crashes on boot.
startCommand = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
